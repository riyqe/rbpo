version: '3.8'

services:
  db:
    image: postgres:16
    container_name: rbpo_postgres
    environment:
      POSTGRES_DB: rbpo_db
      POSTGRES_USER: rbpo_user
      POSTGRES_PASSWORD: rbpo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: rbpo_app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: rbpo_db
      DB_USER: rbpo_user
      DB_PASSWORD: rbpo_pass

volumes:
  postgres_data:
